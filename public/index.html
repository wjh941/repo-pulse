<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>仓库脉搏 · Repo Pulse</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --text2: #6e6e73; --sep: rgba(0,0,0,.08);
    --blue: #0071e3; --green: #34c759; --red: #ff3b30; --orange: #ff9500;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --text2: #a1a1a6; --sep: rgba(255,255,255,.12); }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; padding: 32px 16px 60px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 4px; }
  .sub { color: var(--text2); font-size: 14px; margin-bottom: 22px; }
  .bar { display: flex; gap: 8px; margin-bottom: 20px; }
  .bar input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--sep); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
  .bar input:focus { border-color: var(--blue); }
  .bar button { padding: 10px 20px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .bar button:active { transform: scale(.97); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .stat .l { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .repo { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .repo .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .repo a.name { font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; }
  .repo a.name:hover { color: var(--blue); }
  .score { margin-left: auto; font-weight: 700; font-size: 18px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--text2); }
  .meta { color: var(--text2); font-size: 13px; margin-top: 4px; }
  ul.findings { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text2); }
  ul.findings b { color: var(--text); font-weight: 600; }
  .grade-A { color: var(--green); } .grade-B { color: var(--orange); } .grade-C, .grade-D { color: var(--red); }
  .empty { text-align: center; color: var(--text2); padding: 70px 0; }
  .err { background: rgba(255,59,48,.08); color: var(--red); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .loading { text-align: center; color: var(--text2); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 仓库脉搏</h1>
  <div class="sub">一行命令体检全部公开仓库——CI 状态 / 活跃度 / 元数据，可解释健康评分</div>
  <div class="bar">
    <input id="user" placeholder="GitHub 用户名，如 wjh941" value="wjh941" />
    <button id="go">体检</button>
  </div>
  <div id="out"><div class="empty">输入用户名开始体检 ⬆️</div></div>
</div>
<script>
const out = document.getElementById('out');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function run() {
  const user = document.getElementById('user').value.trim();
  if (!user) return;
  out.innerHTML = '<div class="loading">体检中，约需 2~5 秒（逐仓查询 CI 状态）…</div>';
  try {
    const res = await fetch(`/api/pulse/${encodeURIComponent(user)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    render(data);
  } catch (e) {
    out.innerHTML = `<div class="err">⚠️ ${esc(e.message)}</div>`;
  }
}

function render(r) {
  const s = r.summary;
  const stars = [['平均分', s.avgScore, ''], ['A 级', s.gradeA, `/${s.total}`], ['CI 红灯', s.redCi, ''], ['无 CI', s.noCi, ''], ['超 3 月未更', s.stale, '']];
  let html = '<div class="stats">' + stars.map(([l, n, suf]) =>
    `<div class="stat"><div class="n">${n}${suf}</div><div class="l">${l}</div></div>`).join('') + '</div>';
  html += r.repos.map((repo) => {
    const ci = repo.ciConclusion === 'success' ? '<span class="chip">CI ✅</span>'
      : repo.ciConclusion ? `<span class="chip">CI ❌ ${esc(repo.ciConclusion)}</span>`
      : '<span class="chip">无 CI</span>';
    const worst = repo.findings.find((f) => f.point === 0);
    return `<div class="repo">
      <div class="head">
        <a class="name" href="${esc(repo.url)}" target="_blank" rel="noopener">${esc(repo.name)}</a>
        <span class="chip">${esc(repo.language) || '—'}</span>
        ${ci}
        <span class="score grade-${repo.grade}">${repo.score} <small style="font-weight:400">${repo.grade}</small></span>
      </div>
      <div class="meta">${esc(repo.description)} · 最近推送 ${esc((repo.pushedAt || '—').slice(0, 10))}</div>
      <ul class="findings">${repo.findings.map((f) =>
        `<li>${f.point === 0 ? '⚠️ ' : '✅ '}${esc(f.text)}</li>`).join('')}</ul>
    </div>`;
  }).join('');
  out.innerHTML = html;
}

document.getElementById('go').addEventListener('click', run);
document.getElementById('user').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
run();
</script>
</body>
</html>
